<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Αλέξανδρος Παπαγιαννάκης — Γραφείο</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#FBFAF8; --card:#FFFFFF; --ink:#14181F; --muted:#565E6B;
    --line:#E2DFD9; --accent:#1F3A5F; --accent-soft:#EEF2F7;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:Inter,system-ui,sans-serif; font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:620px; margin:0 auto; padding:40px 20px 72px}
  header{border-bottom:2px solid var(--ink); padding-bottom:22px; margin-bottom:30px}
  h1{font-family:"Noto Serif",Georgia,serif; font-size:30px; line-height:1.2; margin:0 0 6px; font-weight:600}
  .role{color:var(--muted); font-size:15px; margin:0 0 4px}
  .dept{color:var(--muted); font-size:15px; margin:0 0 12px}
  .mail{font-size:15px; margin:0}
  a{color:var(--accent)}
  a:hover{color:#132840}
  .cards{display:flex; flex-direction:column; gap:14px}
  .card{
    display:block; background:var(--card); border:1px solid var(--line);
    border-radius:11px; padding:22px 24px; text-decoration:none; color:inherit;
  }
  a.card:hover{border-color:var(--accent); background:var(--accent-soft)}
  .card h2{font-family:"Noto Serif",Georgia,serif; font-size:19px; margin:0 0 5px; font-weight:600; color:var(--accent)}
  a.card:hover h2{color:#132840}
  .card p{margin:0; color:var(--muted); font-size:15px}
  .card.off{opacity:.62}
  .card.off h2{color:var(--muted)}
  .soon{
    display:inline-block; font-size:12px; font-weight:600; letter-spacing:.04em;
    text-transform:uppercase; color:#6B4310; background:#FDF2E3;
    border:1px solid #EBD4AE; border-radius:999px; padding:3px 10px; margin-top:9px;
  }
  footer{margin-top:40px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:13px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Αλέξανδρος Παπαγιαννάκης</h1>
    <p class="role">Επίκουρος Καθηγητής</p>
    <p class="dept">Πανεπιστήμιο Ιωαννίνων</p>
    <p class="mail"><a href="mailto:papagiannakis.a@uoi.gr">papagiannakis.a@uoi.gr</a></p>
  </header>

  <div class="cards" id="cards"></div>

  <footer>
    Για επείγοντα, στείλε email.
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ------------------------------------------------------------------
     ΑΛΛΑΞΕ ΜΟΝΟ ΑΥΤΕΣ ΤΙΣ ΔΥΟ ΓΡΑΜΜΕΣ.
     Βάλε τα links μέσα στα εισαγωγικά. Όσο μένουν κενά (""), η αντίστοιχη
     κάρτα εμφανίζεται ως «σύντομα» και δεν είναι πατήσιμη.
  ------------------------------------------------------------------ */
  var FORM_URL     = "";   // π.χ. "https://forms.gle/xxxxxxxx"
  var CALENDAR_URL = "";   // π.χ. "https://calendar.app.google/xxxxxxxx"
  /* ---------------------------------------------------------------- */

  var ITEMS = [
    { href: FORM_URL,
      title: "Φόρμα σχολιασμού",
      desc:  "Σχόλια, παρατηρήσεις ή παράπονα για το μάθημα, το εργαστήριο και τη διδασκαλία." },
    { href: CALENDAR_URL,
      title: "Κλείσε ραντεβού",
      desc:  "Διάλεξε μια ελεύθερη ώρα από τις ώρες γραφείου." },
    { href: "quiz.html",
      title: "Quiz αυτοαξιολόγησης",
      desc:  "Έξι σύντομες ερωτήσεις βακτηριακής φυσιολογίας. Δεν βαθμολογείται." }
  ];

  var host = document.getElementById("cards");

  ITEMS.forEach(function(it){
    var live = typeof it.href === "string" && it.href.length > 0;
    var el = document.createElement(live ? "a" : "div");
    el.className = "card" + (live ? "" : " off");
    if (live) el.setAttribute("href", it.href);

    var h = document.createElement("h2");
    h.textContent = it.title;
    el.appendChild(h);

    var p = document.createElement("p");
    p.textContent = it.desc;
    el.appendChild(p);

    if (!live){
      var s = document.createElement("span");
      s.className = "soon";
      s.textContent = "Σύντομα";
      el.appendChild(s);
    }
    host.appendChild(el);
  });
})();
</script>
</body>
</html>
