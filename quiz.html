<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz βακτηριακής φυσιολογίας — Α. Παπαγιαννάκης</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#FBFAF8; --card:#FFFFFF; --ink:#14181F; --muted:#565E6B;
    --line:#E2DFD9; --accent:#1F3A5F; --accent-soft:#EEF2F7;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:Inter,system-ui,sans-serif; font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px; margin:0 auto; padding:34px 20px 72px}
  .back{font-size:14px; display:inline-block; margin-bottom:20px}
  a{color:var(--accent)}
  a:hover{color:#132840}
  h1{font-family:"Noto Serif",Georgia,serif; font-size:27px; line-height:1.22; margin:0 0 8px; font-weight:600}
  .lede{color:var(--muted); margin:0 0 26px; font-size:15px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:24px}
  fieldset{border:none; margin:0; padding:0}
  legend{padding:0; font-weight:500; margin-bottom:12px}
  .q{margin-bottom:26px; padding-bottom:22px; border-bottom:1px solid var(--line)}
  .q:last-of-type{border-bottom:none; margin-bottom:12px}
  .opt{display:flex; gap:11px; align-items:flex-start; padding:9px 11px; border-radius:7px; cursor:pointer; min-height:44px}
  .opt:hover{background:var(--accent-soft)}
  .opt input{margin-top:5px; width:17px; height:17px; accent-color:var(--accent); flex:none}
  .verdict{font-size:14px; margin-top:10px; padding:10px 13px; border-radius:7px}
  .v-ok{background:#E9F3EC; color:#14532B}
  .v-no{background:#FBECEC; color:#7A1F1F}
  .actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:4px}
  .btn{
    font:inherit; font-weight:600; font-size:15px; cursor:pointer;
    background:var(--accent); color:#fff; border:1px solid var(--accent);
    border-radius:7px; padding:12px 22px; min-height:44px;
  }
  .btn:hover{background:#17304f}
  .btn-quiet{background:transparent; color:var(--accent)}
  .btn-quiet:hover{background:var(--accent-soft)}
  .score{font-family:"Noto Serif",Georgia,serif; font-size:20px; font-weight:600; margin:20px 0 0}
  footer{margin-top:36px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Πίσω</a>
  <h1>Quiz: βακτηριακή φυσιολογία</h1>
  <p class="lede">Έξι ερωτήσεις αυτοαξιολόγησης. Δεν βαθμολογείται και δεν καταγράφεται πουθενά — τίποτα δεν φεύγει από τη συσκευή σου.</p>

  <div class="card">
    <form id="qz-form"></form>
    <div class="actions">
      <button type="button" class="btn" id="qz-check">Έλεγχος απαντήσεων</button>
      <button type="button" class="btn btn-quiet" id="qz-reset">Καθάρισμα</button>
    </div>
    <div id="qz-result" aria-live="polite"></div>
  </div>

  <footer>
    Αλέξανδρος Παπαγιαννάκης · <a href="mailto:papagiannakis.a@uoi.gr">papagiannakis.a@uoi.gr</a>
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* Οι ερωτήσεις. Πρόσθεσε ή άλλαξε ελεύθερα:
     s = εκφώνηση, o = επιλογές, a = δείκτης της σωστής (ξεκινά από 0), e = εξήγηση. */
  var QUIZ = [
    { s:'Καθώς αυξάνεται ο ρυθμός ανάπτυξης ενός βακτηρίου σε πλουσιότερο θρεπτικό μέσο, το κλάσμα μάζας των ριβοσωμάτων:',
      o:['Μειώνεται','Παραμένει σταθερό','Αυξάνεται κατά προσέγγιση γραμμικά','Μηδενίζεται'], a:2,
      e:'Είναι ο πρώτος «νόμος ανάπτυξης»: ταχύτερη ανάπτυξη απαιτεί περισσότερα ριβοσώματα ανά μονάδα κυτταρικής μάζας.' },
    { s:'Τι αναστέλλει η χλωραμφενικόλη;',
      o:['Τη σύνθεση του DNA','Τη μετάφραση, δεσμευόμενη στη 50S ριβοσωμική υπομονάδα','Τη σύνθεση πεπτιδογλυκάνης','Τη μεταγραφή'], a:1,
      e:'Εμποδίζει τη δράση της πεπτιδυλοτρανσφεράσης στη μεγάλη ριβοσωμική υπομονάδα.' },
    { s:'Ο λόγος RNA προς πρωτεΐνη σε ένα βακτηριακό κύτταρο χρησιμοποιείται συνήθως ως:',
      o:['Μέτρο του μεγέθους του κυττάρου','Προσέγγιση της αφθονίας των ριβοσωμάτων','Δείκτης βιωσιμότητας','Μέτρο της περιεκτικότητας σε λιπίδια'], a:1,
      e:'Το μεγαλύτερο μέρος του κυτταρικού RNA είναι ριβοσωμικό, οπότε ο λόγος ακολουθεί το ριβοσωμικό κλάσμα.' },
    { s:'Ποιο είναι το κύριο δομικό συστατικό του βακτηριακού κυτταρικού τοιχώματος;',
      o:['Χιτίνη','Κυτταρίνη','Πεπτιδογλυκάνη','Εργοστερόλη'], a:2,
      e:'Η πεπτιδογλυκάνη (μουρεΐνη) σχηματίζει το πλέγμα που αντέχει τη σπαργή πίεση.' },
    { s:'Ποια από τις δύο κατηγορίες διαθέτει εξωτερική μεμβράνη;',
      o:['Τα Gram-θετικά','Τα Gram-αρνητικά','Και οι δύο','Καμία από τις δύο'], a:1,
      e:'Τα Gram-αρνητικά έχουν λεπτό στρώμα πεπτιδογλυκάνης και επιπλέον εξωτερική μεμβράνη με λιποπολυσακχαρίτη.' },
    { s:'Σε ποια φάση της καμπύλης ανάπτυξης ο ρυθμός διαίρεσης και η σύσταση του κυττάρου παραμένουν σταθερά;',
      o:['Λανθάνουσα φάση','Εκθετική φάση','Στατική φάση','Φάση θανάτου'], a:1,
      e:'Στην εκθετική φάση ο πληθυσμός βρίσκεται σε ισορροπημένη ανάπτυξη (balanced growth).' }
  ];

  var qf = document.getElementById('qz-form');

  QUIZ.forEach(function(q, i){
    var d = document.createElement('div'); d.className = 'q';
    var fs = document.createElement('fieldset');
    var lg = document.createElement('legend');
    lg.textContent = (i + 1) + '. ' + q.s;
    fs.appendChild(lg);
    q.o.forEach(function(opt, j){
      var lab = document.createElement('label'); lab.className = 'opt';
      var inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'q' + i; inp.value = String(j);
      var sp = document.createElement('span'); sp.textContent = opt;
      lab.appendChild(inp); lab.appendChild(sp); fs.appendChild(lab);
    });
    d.appendChild(fs);
    var v = document.createElement('div');
    v.className = 'verdict'; v.hidden = true; v.id = 'v' + i;
    d.appendChild(v);
    qf.appendChild(d);
  });

  document.getElementById('qz-check').addEventListener('click', function(){
    var score = 0;
    QUIZ.forEach(function(q, i){
      var sel = qf.querySelector('input[name=q' + i + ']:checked');
      var v = document.getElementById('v' + i);
      v.hidden = false;
      if (sel && Number(sel.value) === q.a){
        score++;
        v.className = 'verdict v-ok';
        v.textContent = 'Σωστό. ' + q.e;
      } else {
        v.className = 'verdict v-no';
        v.textContent = (sel ? 'Λάθος. ' : 'Αναπάντητη. ') +
                        'Σωστή απάντηση: ' + q.o[q.a] + '. ' + q.e;
      }
    });
    var r = document.getElementById('qz-result');
    r.innerHTML = '';
    var p = document.createElement('p');
    p.className = 'score';
    p.textContent = score + ' στα ' + QUIZ.length + ' σωστά';
    r.appendChild(p);
  });

  document.getElementById('qz-reset').addEventListener('click', function(){
    qf.reset();
    QUIZ.forEach(function(_, i){ document.getElementById('v' + i).hidden = true; });
    document.getElementById('qz-result').innerHTML = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
</body>
</html>
